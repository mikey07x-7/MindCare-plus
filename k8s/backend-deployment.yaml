apiVersion: apps/v1
kind: Deployment
metadata:
  name: mindcare-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mindcare-backend
  template:
    metadata:
      labels:
        app: mindcare-backend
    spec:
      containers:
      - name: backend
        image: yourregistry/mindcare-backend:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: mindcare-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: mindcare-backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
